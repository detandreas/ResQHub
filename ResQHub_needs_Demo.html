background:#faeae8}.smalltext{font-size:12px;color:var(--muted)}.kicker{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:700}.kicker:before{content:'';display:block;width:23px;height:2px;background:#7da084}.process{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.step{border:1px solid var(--line);background:#fff;padding:23px}.step .number{color:#6b9774;font:700 30px Arial,Helvetica,sans-serif}.step h3{font:700 21px Arial,Helvetica,sans-serif;margin:9px 0}.step p{font-size:13px;color:var(--muted);margin:0}.trust{display:flex;align-items:center;gap:12px;background:#eaf2e9;border-left:3px solid #5b906c;padding:15px 19px;font-size:13px;color:#31543e;margin-top:22px}footer{border-top:1px solid var(--line);padding:26px 24px;text-align:center;font-size:12px;color:var(--muted);background:white}@media(max-width:920px){.top{flex-wrap:wrap;gap:12px}.top nav{order:3;width:100%}.hero{padding:44px 35px;min-height:320px}.hero h1{font-size:43px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}@media(max-width:600px){.cards,.statrow,.formgrid,.detailgrid,.process{grid-template-columns:1fr}.needrow{align-items:start;flex-direction:column}.needrow .right{text-align:left}.wrap{padding:0 15px 45px}.top{padding:12px 15px}.hero{padding:35px 25px;min-height:320px}.hero h1{font-size:35px}.sectionhead{align-items:start;flex-direction:column}.sectionhead h2,h1.page{font-size:29px}.card .photo{height:135px}.role{margin-left:auto}.panel{padding:20px}}

/* ResQHub editorial interface: a single typeface, no decorative copy. */
:root{--green:#163c30;--ink:#182720;--cream:#f6f7f3;--line:#d9e2d8;--shadow:none}
html,body,button,input,select,textarea,h1,h2,h3,h4{font-family:Arial,Helvetica,sans-serif!important}
body{background:var(--cream);letter-spacing:-.1px}
header{background:#fff;border-bottom:1px solid #e4e9e1;backdrop-filter:none}
.top{max-width:1420px;padding:17px 42px;gap:40px}
.brand{font-size:25px;letter-spacing:-1px}.brandmark{width:40px;height:40px}
.top nav button{font-size:13px;color:#374c3d;font-weight:700;padding:12px 16px}
.top nav button.active{background:#edf2eb;color:#153f2d}
.role{font-size:12px}.role select{border:1px solid #d4dfd2;padding:10px 12px}
.wrap{max-width:1420px;padding:0 42px 80px}
.wowhero{margin-top:28px;min-height:550px;padding:76px 72px;background:#173f31;overflow:hidden;align-items:flex-end}
.wowhero:before{background:linear-gradient(90deg,rgba(7,31,23,.84) 0%,rgba(11,40,29,.56) 48%,rgba(11,40,29,.07) 100%),url('https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=2000&q=90') center 52%/cover;filter:saturate(.8)}
.wowhero .wowcontent{position:relative;z-index:1}.wowhero h1{font-size:clamp(65px,8.3vw,128px);line-height:.91;letter-spacing:-7px;margin:0 0 45px;font-weight:800!important;max-width:1050px}.wowhero .dot{color:#b6e2a8}
.wowhero .hero-actions{gap:12px}.wowhero .btn{font-size:14px;min-height:53px;padding:15px 23px;gap:35px}.wowhero .btn span{font-size:18px}
.btn.glass{background:rgba(10,35,25,.15);color:#fff;border:1px solid rgba(255,255,255,.76)}.btn.glass:hover{background:rgba(255,255,255,.15)}
.hero-corner{position:absolute;right:33px;bottom:30px;font-weight:800;font-size:13px;letter-spacing:2px;color:rgba(255,255,255,.8)}
.home-needs{margin-top:60px}.home-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:20px}.home-section-head h2{font-size:36px;letter-spacing:-1.5px;margin:0}.home-section-head .count{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;font-size:14px;letter-spacing:0;color:#43634f;background:#e6eee4;width:33px;height:33px;margin-left:7px}
.minimal-link{border:0;background:none;color:#163c30;font-size:14px;font-weight:700;cursor:pointer}.minimal-link span{margin-left:12px;font-size:20px}
.cards{gap:18px}.card{border:1px solid #dce4da;box-shadow:none}.card:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(21,49,35,.07)}.card .photo{height:185px}.card .body{padding:24px}.card h3{font-size:24px}.card .foot{padding-top:16px}.card .btn{min-height:42px}
.home-shortcuts{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:18px}.home-shortcuts button{border:1px solid #dce4da;background:#eaf0e7;text-align:left;font-size:21px;font-weight:700;color:#173d2e;padding:28px;display:flex;justify-content:space-between;cursor:pointer}.home-shortcuts button:hover{background:#dfeadc}.home-shortcuts button span{font-size:26px}
footer{padding:18px 25px;font-size:11px;color:#607363}
@media(max-width:920px){.top{padding:14px 22px}.wrap{padding:0 22px 60px}.wowhero{min-height:490px;padding:55px 45px}.wowhero h1{letter-spacing:-4px}}
@media(max-width:600px){.top{padding:13px 15px}.wrap{padding:0 15px 50px}.wowhero{margin-top:14px;min-height:470px;padding:36px 24px}.wowhero h1{font-size:clamp(52px,14vw,78px);letter-spacing:-3.5px;margin-bottom:35px}.wowhero .btn{width:100%;justify-content:space-between}.wowhero .hero-actions{width:100%}.hero-corner{display:none}.home-needs{margin-top:36px}.home-section-head h2{font-size:27px}.home-shortcuts{grid-template-columns:1fr}.home-shortcuts button{font-size:19px;padding:22px}}
</style></head><body><header><div class="top"><button class="brand" type="button" onclick="go('home')" aria-label="ResQHub home"><svg class="brandmark" viewBox="0 0 48 48" width="38" height="38" aria-hidden="true"><rect x="1.5" y="1.5" width="45" height="45" rx="9" fill="#214b3a"/><path d="M11 24l9-9 7 7 7-7 5 5-12 12-7-7-5 5z" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 28l5 5" stroke="#a7d6b0" stroke-width="3.4" stroke-linecap="round"/></svg><span class="brandname">ResQ<span>Hub</span></span></button><nav id="nav"></nav><div class="role"><span>View as</span><select id="role" onchange="setRole(this.value)"><option value="citizen">Citizen</option><option value="hub">HubManager</option></select></div></div></header><div class="wrap" id="app"></div><footer>ResQHub · Demo</footer><script>
'use strict';const KEY='resqhub_aid_needs_v1';const seed={events:[{id:1,title:'Thessaly Flood Response',type:'Flood',location:'Larissa, Greece',date:'2026-10-20',description:'Local relief organizations are supporting families affected by flooding.'},{id:2,title:'Evia Wildfire Relief',type:'Wildfire',location:'Evia, Greece',date:'2026-10-29',description:'Essential supplies are needed for displaced residents.'},{id:3,title:'Western Greece Earthquake',type:'Earthquake',location:'Patras, Greece',date:'2026-11-01',description:'Community organizations are collecting essentials for affected households.'}],hubs:[{id:1,name:'Community Relief Network',email:'help@community.example'},{id:2,name:'Solidarity Support Hub',email:'contact@solidarity.example'}],needs:[{id:1,eventId:1,hubId:1,title:'Bottled water',unit:'cases',quantity:120,notes:'Sealed cases of drinking water',category:'Goods'},{id:2,eventId:1,hubId:1,title:'Blankets',unit:'items',quantity:80,notes:'Clean blankets in good condition',category:'Goods'},{id:3,eventId:1,hubId:2,title:'Sorting volunteers',unit:'people',quantity:15,notes:'Help sort supplies at the collection point',category:'Volunteers'},{id:4,eventId:2,hubId:1,title:'Hygiene kits',unit:'kits',quantity:50,notes:'Soap, toothbrushes and personal care items',category:'Goods'},{id:5,eventId:2,hubId:2,title:'Food packages',unit:'packages',quantity:75,notes:'Non-perishable food packages',category:'Goods'},{id:6,eventId:3,hubId:2,title:'Sleeping bags',unit:'items',quantity:40,notes:'Clean, usable sleeping bags',category:'Goods'}],offers:[{id:1,needId:1,name:'Alex Morgan',email:'alex@example.com',quantity:20,status:'received',date:'2026-11-02'},{id:2,needId:2,name:'Sam Taylor',email:'sam@example.com',quantity:10,status:'pending',date:'2026-11-03'}],nextId:100};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){db=structuredClone(seed)}if(!db.events||!db.needs||!db.offers)db=structuredClone(seed);let role='citizen',page='home',selectedEvent=1,selectedNeed=1,editNeed=null,search='',typeFilter='All',message='';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(db))}function evt(id){return db.events.find(x=>x.id===Number(id))}function hub(id){return db.hubs.find(x=>x.id===Number(id))}function need(id){return db.needs.find(x=>x.id===Number(id))}function offers(id){return db.offers.filter(x=>x.needId===id)}function received(id){return offers(id).filter(x=>x.status==='received').reduce((a,x)=>a+x.quantity,0)}function pending(id){return offers(id).filter(x=>x.status==='pending').reduce((a,x)=>a+x.quantity,0)}function remaining(n){return Math.max(0,n.quantity-received(n.id)-pending(n.id))}function pct(n){return Math.min(100,Math.round(100*received(n.id)/n.quantity))}function go(p,id){page=p;if(p==='event')selectedEvent=Number(id);if(p==='offer')selectedNeed=Number(id);if(p==='editNeed')editNeed=id==null?null:Number(id);message='';render();window.scrollTo(0,0)}function setRole(v){role=v;go(v==='hub'?'dashboard':'home')}function note(s,err=false){message=`<div class="notice ${err?'error':''}">${esc(s)}</div>`;render()}function badgeEvent(e){return e.type.toLowerCase()==='wildfire'?'fire':e.type.toLowerCase()==='earthquake'?'quake':'flood'}function ncard(n){const e=evt(n.eventId),h=hub(n.hubId),r=remaining(n);return `<article class="card"><div class="photo ${badgeEvent(e)}"><span class="event-chip">${esc(e.type)}</span><span style="text-shadow:0 1px 5px #0006">${esc(e.location)}</span></div><div class="body"><span class="tag">${esc(n.category)}</span><h3>${esc(n.title)}</h3><p>${esc(h.name)}<br>${esc(e.title)}</p><div style="margin-top:auto"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><strong style="font-size:20px;color:var(--green)">${r} <small style="font-size:12px;font-weight:normal">${esc(n.unit)} available</small></strong><span class="smalltext">${pct(n)}% received</span></div><div class="progress" role="progressbar" aria-valuenow="${pct(n)}" aria-valuemin="0" aria-valuemax="100"><div style="width:${pct(n)}%"></div></div><p style="margin-bottom:14px">${received(n.id)} delivered | ${pending(n.id)} pledged</p></div><div class="foot"><span class="smalltext">${esc(e.location)}</span><button class="btn small" onclick="go('offer',${n.id})" ${r===0?'disabled':''}>${r===0?'Fully pledged':'Offer help →'}</button></div></div></article>`}
function needLine(n,manager=false){return `<div class="needrow"><div style="flex:1"><span class="tag">${esc(n.category)}</span><h3>${esc(n.title)}</h3><p>${esc(hub(n.hubId).name)} | ${esc(n.notes||'')}</p><div class="progress" style="max-width:420px"><div style="width:${pct(n)}%"></div></div><div class="smalltext">${received(n.id)} received | ${pending(n.id)} pending | ${n.quantity} requested ${esc(n.unit)}</div></div><div class="right"><strong>${remaining(n)} ${esc(n.unit)}</strong><span class="smalltext">still available to pledge</span><div style="margin-top:10px">${manager?`<button class="btn soft small" onclick="go('editNeed',${n.id})">Edit need</button>`:`<button class="btn small" onclick="go('offer',${n.id})" ${remaining(n)===0?'disabled':''}>Offer help</button>`}</div></div></div>`}function header(title,subtitle,action=''){return `<div class="pageintro"><h1 class="page">${title}</h1><p>${subtitle}</p></div>${action}`}
function home(){const ns=db.needs.filter(n=>remaining(n)>0).sort((a,b)=>remaining(b)-remaining(a));return `<section class="hero wowhero"><div class="wowcontent"><h1>Every need<br>matters<span class="dot">.</span></h1><div class="hero-actions"><button class="btn light" onclick="go('needs')">Explore needs <span aria-hidden="true">↗</span></button><button class="btn glass" onclick="go('disasters')">View disasters <span aria-hidden="true">↗</span></button>${role==='hub'?`<button class="btn glass" onclick="go('editNeed')">Publish a need <span aria-hidden="true">+</span></button>`:''}</div></div><div class="hero-corner" aria-hidden="true">R / H</div></section><section class="home-needs" id="open-needs"><div class="home-section-head"><h2>Open needs <span class="count">${ns.length}</span></h2><button class="minimal-link" onclick="go('needs')">View all <span aria-hidden="true">↗</span></button></div><div class="cards">${ns.slice(0,6).map(ncard).join('')||'<div class="empty">No open needs.</div>'}</div></section><div class="home-shortcuts"><button onclick="go('disasters')">Disasters <span>↗</span></button>${role==='hub'?`<button onclick="go('dashboard')">My organization <span>↗</span></button>`:`<button onclick="go('needs')">Offer help <span>↗</span></button>`}</div>`}
function needsPage(){const filtered=db.needs.filter(n=>{let e=evt(n.eventId),h=hub(n.hubId);return [n.title,e.title,e.location,h.name].join(' ').toLowerCase().includes(search.toLowerCase())&&(typeFilter==='All'||n.category===typeFilter)});return header('Current relief needs','Find a specific request and offer the quantity you can provide.')+`<div class="toolbar"><input class="field" placeholder="Search needs, locations, organizations" value="${esc(search)}" oninput="search=this.value;refreshResults()"><select class="field" onchange="typeFilter=this.value;refreshResults()"><option ${typeFilter==='All'?'selected':''}>All</option><option ${typeFilter==='Goods'?'selected':''}>Goods</option><option ${typeFilter==='Volunteers'?'selected':''}>Volunteers</option></select></div><div id="results"><div class="cards">${filtered.map(ncard).join('')||'<div class="empty">No matching needs.</div>'}</div></div>`}function refreshResults(){const filtered=db.needs.filter(n=>{const e=evt(n.eventId),h=hub(n.hubId);return [n.title,e.title,e.location,h.name].join(' ').toLowerCase().includes(search.toLowerCase())&&(typeFilter==='All'||n.category===typeFilter)});$('results').innerHTML=`<div class="cards">${filtered.map(ncard).join('')||'<div class="empty">No matching needs.</div>'}</div>`}function disasters(){return header('Disaster events','Explore incidents and see the needs published by participating organizations.')+`<div class="cards">${db.events.map(e=>`<article class="card"><div class="photo ${badgeEvent(e)}">${esc(e.type.toUpperCase())}</div><div class="body"><span class="tag">${esc(e.type)}</span><h3>${esc(e.title)}</h3><p>${esc(e.location)} | ${esc(e.date)}</p><p>${esc(e.description)}</p><div class="foot"><span class="smalltext">${new Set(db.needs.filter(n=>n.eventId===e.id).map(n=>n.hubId)).size} organizations</span><button class="btn small" onclick="go('event',${e.id})">View details</button></div></div></article>`).join('')}</div>`}function eventPage(){const e=evt(selectedEvent);if(!e)return '<p>Event not found.</p>';const ns=db.needs.filter(n=>n.eventId===e.id);return header(esc(e.title),'Disaster event / '+esc(e.location))+`<div class="panel"><div class="detailgrid"><div><small>Type</small><strong>${esc(e.type)}</strong></div><div><small>Location</small><strong>${esc(e.location)}</strong></div><div><small>Reported</small><strong>${esc(e.date)}</strong></div></div><p>${esc(e.description)}</p></div><div class="sectionhead"><div><h2>Needs by organization</h2><p>${ns.length} published requests | ${new Set(ns.map(n=>n.hubId)).size} participating organizations</p></div><button class="btn outline small" onclick="go('disasters')">Back to events</button></div>${ns.map(n=>needLine(n)).join('')||'<div class="empty">No needs published yet.</div>'}`}
function offerPage(){const n=need(selectedNeed);if(!n)return '<p>Need not found.</p>';const e=evt(n.eventId);return header('Offer help','Submit a pledge to the responsible organization.')+`<div class="two"><div class="panel"><h3>${esc(n.title)}</h3><p>${esc(e.title)} | ${esc(hub(n.hubId).name)}</p><div class="detailgrid"><div><small>Requested</small><strong>${n.quantity} ${esc(n.unit)}</strong></div><div><small>Received</small><strong>${received(n.id)}</strong></div><div><small>Available to pledge</small><strong>${remaining(n)} ${esc(n.unit)}</strong></div></div><p class="muted">${esc(n.notes)}</p><div class="notice">Your offer will be marked <b>Pending</b>. It will count as received only after the organization confirms delivery.</div></div><div class="panel"><h3>Your pledge</h3><form onsubmit="submitOffer(event,${n.id})"><div class="formgrid"><div class="wide"><label for="name">Full name</label><input class="field" id="name" required maxlength="80"></div><div class="wide"><label for="email">Email</label><input class="field" id="email" type="email" required maxlength="120"></div><div class="wide"><label for="qty">Quantity (${esc(n.unit)})</label><input class="field" id="qty" type="number" min="1" max="${remaining(n)}" required value="1"></div></div><p class="hint">Demo only. Do not enter real personal information.</p><button class="btn" type="submit" ${remaining(n)===0?'disabled':''}>Submit offer</button></form></div></div>`}function submitOffer(ev,id){ev.preventDefault();const n=need(id),qty=Number($('qty').value),name=$('name').value.trim(),email=$('email').value.trim();if(!name||!email||!Number.isInteger(qty)||qty<1||qty>remaining(n))return note('Please enter valid details and an available quantity.',true);db.offers.push({id:db.nextId++,needId:id,name,email,quantity:qty,status:'pending',date:new Date().toISOString().slice(0,10)});save();go('needs');note(`Thank you! Your offer of ${qty} ${n.unit} is pending confirmation by ${hub(n.hubId).name}.`)}
function dashboard(){const ns=db.needs.filter(n=>n.hubId===1),os=db.offers.filter(o=>ns.some(n=>n.id===o.needId));return header('Organization dashboard','Community Relief Network | Publish needs and confirm deliveries.',`<div class="toolbar"><button class="btn" onclick="go('editNeed')">+ Publish a need</button><button class="btn soft" onclick="go('incoming')">Review offers (${os.filter(o=>o.status==='pending').length} pending)</button></div>`)+`<div class="statrow"><div class="stat"><strong>${ns.length}</strong><span>Published needs</span></div><div class="stat"><strong>${os.filter(o=>o.status==='pending').length}</strong><span>Pending offers</span></div><div class="stat"><strong>${os.filter(o=>o.status==='received').length}</strong><span>Confirmed receipts</span></div></div><section class="section"><div class="sectionhead"><div><h2>Your organization's needs</h2><p>Only your organization can edit these requests.</p></div></div>${ns.map(n=>needLine(n,true)).join('')||'<div class="empty">No requests yet.</div>'}</section>`}function editNeedPage(){const n=editNeed===null?null:need(editNeed);if(n&&n.hubId!==1)return '<p>Not authorized.</p>';return header(n?'Edit relief need':'Publish a relief need','Requests are linked to an existing disaster event.')+`<div class="panel"><form onsubmit="submitNeed(event)"><div class="formgrid"><div><label>Disaster event</label><select class="field" id="eventId" required>${db.events.map(e=>`<option value="${e.id}" ${n?.eventId===e.id?'selected':''}>${esc(e.title)}</option>`).join('')}</select></div><div><label>Category</label><select class="field" id="category"><option ${n?.category==='Goods'?'selected':''}>Goods</option><option ${n?.category==='Volunteers'?'selected':''}>Volunteers</option></select></div><div class="wide"><label>Need title</label><input class="field" id="title" required maxlength="80" value="${esc(n?.title||'')}" placeholder="e.g. Blankets"></div><div><label>Required quantity</label><input class="field" id="quantity" type="number" min="1" max="100000" required value="${n?.quantity||''}"></div><div><label>Unit</label><input class="field" id="unit" required maxlength="30" value="${esc(n?.unit||'')}" placeholder="items, cases, people"></div><div class="wide"><label>Notes</label><textarea class="field" id="notes" rows="3" maxlength="300">${esc(n?.notes||'')}</textarea></div></div><p class="hint">A requested quantity cannot be lower than aid already received or pledged.</p><div class="toolbar"><button class="btn" type="submit">${n?'Save changes':'Publish need'}</button><button class="btn outline" type="button" onclick="go('dashboard')">Cancel</button></div></form></div>`}function submitNeed(ev){ev.preventDefault();const quantity=Number($('quantity').value),old=editNeed===null?null:need(editNeed);if(!Number.isInteger(quantity)||quantity<1||quantity<(old?received(old.id)+pending(old.id):0))return note('Quantity cannot be lower than existing received and pending offers.',true);const data={eventId:Number($('eventId').value),hubId:1,category:$('category').value,title:$('title').value.trim(),quantity,unit:$('unit').value.trim(),notes:$('notes').value.trim()};if(!data.title||!data.unit)return note('Complete all required fields.',true);if(old)Object.assign(old,data);else db.needs.push({id:db.nextId++,...data});save();go('dashboard');note(old?'Need updated successfully.':'New need published successfully.')}function incoming(){const ns=db.needs.filter(n=>n.hubId===1),os=db.offers.filter(o=>ns.some(n=>n.id===o.needId)).sort((a,b)=>b.id-a.id);return header('Incoming offers','Confirm delivery only when the aid has actually been received.')+`<div class="panel"><h3>Offers for Community Relief Network</h3>${os.map(o=>{const n=need(o.needId);return `<div class="listline"><div><strong>${esc(n.title)} | ${o.quantity} ${esc(n.unit)}</strong><div class="smalltext">${esc(o.name)} | ${esc(o.email)} | ${esc(o.date)}</div></div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="status ${o.status}">${esc(o.status)}</span>${o.status==='pending'?`<button class="btn small" onclick="updateOffer(${o.id},'received')">Confirm receipt</button><button class="btn outline small" onclick="updateOffer(${o.id},'declined')">Decline</button>`:''}</div></div>`}).join('')||'<div class="empty">No offers yet.</div>'}</div><button class="btn soft" onclick="go('dashboard')">Back to dashboard</button>`}function updateOffer(id,status){const o=db.offers.find(x=>x.id===id);if(!o||o.status!=='pending'||need(o.needId)?.hubId!==1)return; o.status=status;save();note(status==='received'?'Receipt confirmed. The fulfilled quantity has been updated.':'Offer declined. The quantity is available again.')}function render(){const items=role==='hub'?[['home','Home'],['needs','Explore needs'],['disasters','Disasters'],['dashboard','My organization'],['incoming','Incoming offers']]:[['home','Home'],['needs','Explore needs'],['disasters','Disasters']];$('role').value=role;$('nav').innerHTML=items.map(([p,label])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${label}</button>`).join('');const views={home,needs:needsPage,disasters,event:eventPage,offer:offerPage,dashboard,editNeed:editNeedPage,incoming};if(role!=='hub'&&['dashboard','editNeed','incoming'].includes(page))page='home';$('app').innerHTML=(message||'')+(views[page]||home)()}render();
</script></body></html>
