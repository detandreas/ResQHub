<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ResQHub | Disaster Event Management</title>
  <style>
    :root{--sage:#64748b;--cream:#e9f1fa;--wine:#174a76;--paper:#ffffff;--ink:#18283b;--muted:#64748b;--line:#dce5ee;--error:#a12929}
    *{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:var(--ink);font:15px/1.5 Arial,Helvetica,sans-serif}
    header{background:var(--wine);color:#fff;padding:18px max(22px,calc((100vw - 1140px)/2));display:flex;justify-content:space-between;align-items:center;gap:16px}
    .brand{font-size:23px;font-weight:800;letter-spacing:-.6px}.brand span{color:#a8dcff}.role{font-size:12px;background:#ffffff1d;padding:8px 12px;border:1px solid #ffffff38;border-radius:0}
    main{max-width:1140px;margin:35px auto;padding:0 22px 65px}.eyebrow{text-transform:uppercase;letter-spacing:2px;color:var(--wine);font-size:11px;font-weight:800}h1{font-size:clamp(27px,4vw,39px);letter-spacing:-1.2px;margin:5px 0}p.lead{color:var(--muted);margin:0 0 26px;max-width:760px}
    .layout{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-items:start}.panel{background:var(--paper);border:1px solid var(--line);border-radius:0;box-shadow:0 8px 25px #203a5510;overflow:hidden}.panel-heading{padding:22px 25px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.panel-heading h2{font-size:19px;margin:0}.chip{background:#e8f1fa;color:#355a7c;padding:5px 10px;border-radius:0;font-size:11px;font-weight:750}
    form{padding:23px 25px 26px}.section-title{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--wine);font-weight:800;margin:0 0 14px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:17px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}label{font-size:13px;font-weight:650}.req{color:var(--wine)}input,select,textarea{width:100%;font:inherit;background:#fff;border:1px solid #cad8e6;border-radius:0;padding:11px 12px;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--wine);box-shadow:0 0 0 3px #174a761a}textarea{min-height:95px;resize:vertical}.help{font-size:11px;color:var(--muted)}.divider{border:0;border-top:1px solid var(--line);margin:25px 0 20px}
    .hub-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hub{border:1px solid var(--line);padding:10px;border-radius:0;display:flex;align-items:center;gap:8px;font-size:12px}.hub input{width:auto;accent-color:var(--wine)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}.btn{border:0;border-radius:0;padding:12px 18px;font-weight:750;cursor:pointer;font:inherit}.primary{background:var(--wine);color:#fff}.secondary{background:var(--cream);color:var(--wine)}.ghost{background:transparent;border:1px solid #cad8e6;color:var(--ink)}.danger{color:var(--error);border:1px solid #e6c9c9;background:white}.btn:hover{filter:brightness(.95)}.btn:focus-visible{outline:3px solid var(--sage)}
    .side{display:grid;gap:20px}.events{padding:8px 17px 18px}.event{padding:14px 4px;border-bottom:1px solid var(--line)}.event:last-child{border:0}.event h3{font-size:14px;margin:0 0 4px}.meta{font-size:12px;color:var(--muted)}.event-buttons{display:flex;gap:8px;margin-top:10px}.mini{border:1px solid var(--line);background:#fff;border-radius:0;padding:5px 9px;cursor:pointer;color:var(--wine);font-size:12px}.empty{padding:26px 5px;text-align:center;color:var(--muted);font-size:13px}.notice{margin:0 0 20px;padding:12px 15px;border-radius:0;background:#eaf0e7;border:1px solid #c5d4bd;color:#344a30}.notice.error{background:#fff0ee;border-color:#efc7c2;color:#8d2720}[hidden]{display:none!important}.footnote{font-size:12px;color:var(--muted);margin-top:18px}
    .date-entry{position:relative}.date-entry input{padding-right:52px}.calendar-toggle{position:absolute;right:1px;top:1px;height:calc(100% - 2px);width:43px;border:0;border-left:1px solid var(--line);background:#f7f9fc;color:var(--wine);font-size:19px;cursor:pointer;font-family:inherit}
    .calendar-panel{position:absolute;z-index:20;top:calc(100% + 5px);left:0;width:290px;max-width:calc(100vw - 60px);background:#fff;border:1px solid #bdcbd9;box-shadow:0 12px 25px #18283b22;padding:12px}
    .calendar-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.calendar-top button{border:1px solid var(--line);background:#fff;color:var(--ink);font:22px Arial,sans-serif;width:34px;height:32px;cursor:pointer}.calendar-top strong{font-size:14px}
    .calendar-weekdays,.calendar-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;gap:2px}.calendar-weekdays{font-size:11px;color:var(--muted);padding-bottom:5px}.calendar-days button{border:1px solid transparent;background:white;font:13px Arial,sans-serif;height:34px;cursor:pointer;color:var(--ink)}.calendar-days button:hover,.calendar-days button:focus-visible{background:#e9f1fa;border-color:#cad8e6}.calendar-days button.selected{background:var(--wine);color:#fff}.calendar-days button.today{border-color:var(--wine)}
    .event-count{font-size:13px;color:var(--muted)}
    @media(max-width:830px){.layout{grid-template-columns:1fr}.side{grid-template-columns:1fr}}@media(max-width:590px){header{padding:15px 20px}.role{display:none}.fields,.hub-grid,.side{grid-template-columns:1fr}.panel-heading,form{padding:19px}.actions .btn{flex:1}}
  </style>
</head>
<body>
<header><div class="brand">ResQ<span>Hub</span></div><div class="role">Administrator</div></header>
<main>
  <h1>Create &amp; Edit Disaster Event</h1>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <div class="layout">
    <section class="panel" aria-labelledby="form-title">
      <div class="panel-heading"><h2 id="form-title">New disaster event</h2></div>
      <!-- JSP integration: replace action="#" with ${pageContext.request.contextPath}/admin/disasters and POST to a Servlet. -->
      <form id="disasterForm" action="#" method="post">
        <input type="hidden" name="eventId" id="eventId">
        <div class="section-title">Event details</div>
        <div class="fields">
          <div class="field full"><label for="title">Event title <span class="req">*</span></label><input id="title" name="title" required maxlength="120" placeholder="e.g. Thessaly Flood Emergency"></div>
          <div class="field"><label for="disasterType">Disaster type <span class="req">*</span></label><select id="disasterType" name="disasterType" required><option value="">Select type</option><option>Earthquake</option><option>Flood</option><option>Wildfire</option><option>Storm</option><option>Landslide</option><option>Drought</option><option>Other</option></select></div>
          <div class="field"><label for="eventDateDisplay">Date of occurrence <span class="req">*</span></label>
            <div class="date-entry">
              <input id="eventDateDisplay" type="text" required autocomplete="off" inputmode="numeric" placeholder="dd/mm/yyyy" maxlength="10" aria-label="Date of occurrence in day/month/year format">
              <button type="button" class="calendar-toggle" id="calendarToggle"
              aria-label="Open calendar" aria-expanded="false"
              aria-controls="calendarPanel">
                <svg width="18" height="18" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="1.7"
                    stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                  <rect x="3" y="5" width="18" height="16"/>
                  <path d="M7 3v4M17 3v4M3 10h18"/>
                </svg>
              </button>
              <div class="calendar-panel" id="calendarPanel" hidden>
                <div class="calendar-top"><button type="button" id="prevMonth" aria-label="Previous month">&#8249;</button><strong id="calendarMonth"></strong><button type="button" id="nextMonth" aria-label="Next month">&#8250;</button></div>
                <div class="calendar-weekdays"><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span></div>
                <div class="calendar-days" id="calendarDays"></div>
              </div>
            </div>
            <input type="hidden" id="eventDate" name="eventDate">
          </div>
          <div class="field"><label for="country">Country <span class="req">*</span></label><input id="country" name="country" required maxlength="80" placeholder="e.g. Greece"></div>
          <div class="field"><label for="city">City / Region <span class="req">*</span></label><input id="city" name="city" required maxlength="100" placeholder="e.g. Larissa"></div>
          <div class="field"><label for="latitude">Latitude <span class="req">*</span></label><input type="number" id="latitude" name="latitude" min="-90" max="90" step="any" required placeholder="39.6390"></div>
          <div class="field"><label for="longitude">Longitude <span class="req">*</span></label><input type="number" id="longitude" name="longitude" min="-180" max="180" step="any" required placeholder="22.4191"></div>
          <div class="field full"><label for="severity">Severity level <span class="req">*</span></label><select id="severity" name="severity" required><option value="">Select severity</option><option value="1">1 - Low</option><option value="2">2 - Moderate</option><option value="3">3 - High</option><option value="4">4 - Critical</option><option value="5">5 - Catastrophic</option></select></div>
          <div class="field full"><label for="description">Description <span class="req">*</span></label><textarea id="description" name="description" required maxlength="1000" placeholder="Briefly describe the disaster and its impact..."></textarea><span class="help">Maximum 1,000 characters.</span></div>
        </div>
        <hr class="divider">
        <div class="section-title">Participating hubs</div>

        <div class="hub-grid" id="hubChoices">
          <label class="hub"><input type="checkbox" name="hubIds" value="1"> Hellenic Red Cross</label>
          <label class="hub"><input type="checkbox" name="hubIds" value="2"> Civil Protection Hub</label>
          <label class="hub"><input type="checkbox" name="hubIds" value="3"> Municipal Relief Center</label>
          <label class="hub"><input type="checkbox" name="hubIds" value="4"> Volunteer Support Hub</label>
        </div>
        <div class="actions"><button class="btn primary" type="submit" id="submitBtn">Submit Disaster Form</button><button class="btn secondary" type="button" id="resetBtn">Clear form</button></div>
      </form>
    </section>
    <aside class="side">
      <section class="panel"><div class="panel-heading"><h2>Registered events</h2><span class="event-count" id="eventCount">0 events</span></div><div class="events" id="eventList"><div class="empty">No events created yet.</div></div></section>
    </aside>
  </div>
</main>
<script>
  // Standalone prototype only. Replace this localStorage layer with a JSP/Servlet POST + database.
  const KEY='resqhub_disaster_events_v1';
  const form=document.getElementById('disasterForm');
  const fields=['eventId','title','disasterType','eventDate','country','city','latitude','longitude','severity','description'];
  let events=[];
  try{events=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(events))events=[]}catch{events=[]}
  const $=id=>document.getElementById(id);
  const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function flash(message,isError=false){const n=$('notice');n.textContent=message;n.className='notice'+(isError?' error':'');n.hidden=false;n.scrollIntoView({behavior:'smooth',block:'nearest'});}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(events));return true}catch{flash('Could not save event in browser storage.',true);return false}}
  function render(){ $('eventCount').textContent=events.length+' event'+(events.length===1?'':'s'); $('eventList').innerHTML=events.length?events.map(e=>`<article class="event"><h3>${safe(e.title)}</h3><div class="meta">${safe(e.disasterType)} | ${safe(e.city)}, ${safe(e.country)}<br>${safe(e.eventDate)} | Severity ${safe(e.severity)}</div><div class="event-buttons"><button class="mini" type="button" data-edit="${safe(e.eventId)}">Edit</button><button class="mini" type="button" data-delete="${safe(e.eventId)}">Delete</button></div></article>`).join(''):'<div class="empty">No events created yet.</div>';}
  function clear(){form.reset();$('eventDate').value='';$('eventDateDisplay').value='';closeCalendar();$('eventId').value='';$('form-title').textContent='New disaster event';$('submitBtn').textContent='Submit Disaster Form';}
  $('resetBtn').addEventListener('click',clear);
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const pad=n=>String(n).padStart(2,'0');
  let shownMonth=new Date();shownMonth=new Date(shownMonth.getFullYear(),shownMonth.getMonth(),1);
  function validDate(day,month,year){const d=new Date(year,month-1,day);return year>=1900&&year<=2100&&d.getFullYear()===year&&d.getMonth()===month-1&&d.getDate()===day;}
  function parseDisplayDate(value){const m=value.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(!m)return null;const day=+m[1],month=+m[2],year=+m[3];return validDate(day,month,year)?{day,month,year}:null;}
  function syncDate(){const d=parseDisplayDate($('eventDateDisplay').value);if(!d){flash('Enter a valid date as dd/mm/yyyy.',true);$('eventDateDisplay').focus();return false;}$('eventDate').value=`${d.year}-${pad(d.month)}-${pad(d.day)}`;return true;}
  function restoreDate(iso){const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);$('eventDateDisplay').value=m?`${m[3]}/${m[2]}/${m[1]}`:'';}
  function closeCalendar(){$('calendarPanel').hidden=true;$('calendarToggle').setAttribute('aria-expanded','false');}
  function drawCalendar(){const y=shownMonth.getFullYear(),m=shownMonth.getMonth();$('calendarMonth').textContent=`${months[m]} ${y}`;const first=(new Date(y,m,1).getDay()+6)%7;const count=new Date(y,m+1,0).getDate();const selected=parseDisplayDate($('eventDateDisplay').value);const now=new Date();const root=$('calendarDays');root.replaceChildren();for(let i=0;i<first;i++)root.appendChild(document.createElement('span'));for(let day=1;day<=count;day++){const btn=document.createElement('button');btn.type='button';btn.textContent=day;btn.setAttribute('aria-label',`${pad(day)}/${pad(m+1)}/${y}`);if(selected&&selected.day===day&&selected.month===m+1&&selected.year===y)btn.classList.add('selected');if(day===now.getDate()&&m===now.getMonth()&&y===now.getFullYear())btn.classList.add('today');btn.addEventListener('click',()=>{$('eventDateDisplay').value=`${pad(day)}/${pad(m+1)}/${y}`;$('eventDate').value=`${y}-${pad(m+1)}-${pad(day)}`;closeCalendar();});root.appendChild(btn);}}
  $('calendarToggle').addEventListener('click',()=>{if(!$('calendarPanel').hidden){closeCalendar();return;}const d=parseDisplayDate($('eventDateDisplay').value);if(d)shownMonth=new Date(d.year,d.month-1,1);drawCalendar();$('calendarPanel').hidden=false;$('calendarToggle').setAttribute('aria-expanded','true');});
  $('prevMonth').addEventListener('click',()=>{shownMonth=new Date(shownMonth.getFullYear(),shownMonth.getMonth()-1,1);drawCalendar();});
  $('nextMonth').addEventListener('click',()=>{shownMonth=new Date(shownMonth.getFullYear(),shownMonth.getMonth()+1,1);drawCalendar();});
  document.addEventListener('click',e=>{if(!e.target.closest('.date-entry'))closeCalendar();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCalendar();});
  form.addEventListener('submit',e=>{e.preventDefault();if(!form.reportValidity()||!syncDate())return;const hubIds=[...form.querySelectorAll('[name="hubIds"]:checked')].map(el=>el.value);if(!hubIds.length){flash('Please select at least one participating hub.',true);return;}const data=Object.fromEntries(fields.map(id=>[id,$(id).value.trim()]));data.hubIds=hubIds;if(!data.eventId)data.eventId=typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():String(Date.now());const idx=events.findIndex(x=>x.eventId===data.eventId);if(idx>=0)events[idx]=data;else events.unshift(data);if(persist()){render();flash(idx>=0?'Disaster event updated successfully (browser demo).':'Disaster event created successfully (browser demo).');clear();}});
  $('eventList').addEventListener('click',e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(edit){const event=events.find(x=>x.eventId===edit.dataset.edit);if(!event)return;fields.forEach(id=>$(id).value=event[id]??'');restoreDate(event.eventDate);form.querySelectorAll('[name="hubIds"]').forEach(el=>el.checked=(event.hubIds||[]).includes(el.value));$('form-title').textContent='Edit disaster event';$('submitBtn').textContent='Save changes';form.scrollIntoView({behavior:'smooth',block:'start'});}if(del){const event=events.find(x=>x.eventId===del.dataset.delete);if(event&&confirm(`Delete "${event.title}"?`)){events=events.filter(x=>x.eventId!==event.eventId);if(persist()){render();if($('eventId').value===event.eventId)clear();flash('Disaster event deleted (browser demo).');}}}});
  render();
</script>
</body>
</html>
