<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Explore needs | ResQHub</title>
    <meta name="description" content="Search relief needs by item, location or organization.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/store.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/pages/needs.js" defer></script>
</head>

<body>
    <a class="skip" href="#main">Skip to content</a>

    <header class="topbar">
        <div class="topbar__inner">
            <a class="brand" href="index.html" aria-label="ResQHub home">
                <svg class="brand__mark" viewBox="0 0 48 48" aria-hidden="true">
                    <rect class="bm-bg" x="1.5" y="1.5" width="45" height="45" rx="12" />
                    <path class="bm-line" d="M11 24l9-9 7 7 7-7 5 5-12 12-7-7-5 5z" />
                    <path class="bm-spark" d="M24 28l5 5" />
                </svg>
                <span class="brand__name">ResQ<span>Hub</span></span>
            </a>
            <nav class="nav" aria-label="Main">
                <a href="index.html">Home</a>
                <a href="needs.html" aria-current="page">Explore needs</a>
                <a href="disasters.html">Disasters</a>
                <a class="hub-only" href="dashboard.html">My organization</a>
                <a class="hub-only" href="offers.html">Incoming offers <span class="count" data-pending-count hidden></span></a>
            </nav>
            <label class="role"><span>View as</span>
                <select class="input select select--pill" id="role" aria-label="View as">
                    <option value="citizen">Citizen</option>
                    <option value="hub">HubManager</option>
                </select>
            </label>
        </div>
    </header>

    <main class="wrap" id="main">
        <div class="flash" id="flash" aria-live="polite"></div>

        <section class="intro">
            <p class="eyebrow">Explore needs</p>
            <h1 class="intro__title">Current relief needs</h1>
            <p class="intro__text">Find a specific request and offer the quantity you can provide.</p>
        </section>

        <form class="toolbar" id="filters" role="search">
            <div class="field field--grow">
                <label class="field__label" for="search">Search</label>
                <input class="input" id="search" type="search" placeholder="Needs, locations, organizations" autocomplete="off">
            </div>
            <div class="field">
                <label class="field__label" for="category">Category</label>
                <select class="input select" id="category">
                    <option value="All">All categories</option>
                    <option value="Goods">Goods</option>
                    <option value="Volunteers">Volunteers</option>
                </select>
            </div>
        </form>

        <p class="results-count" id="result-count" aria-live="polite"></p>
        <div class="cards" id="results"></div>
    </main>

    <footer class="footer">ResQHub · Demo</footer>
</body>

</html>
