<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Incoming offers | ResQHub</title>
    <meta name="description" content="Confirm or decline pledges made to your organization's needs.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/store.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/pages/offers.js" defer></script>
</head>

<body>
    <a class="skip" href="#main">Skip to content</a>

    <header class="topbar">
        <div class="topbar__inner">
            <a class="brand" href="index.html" aria-label="ResQHub home">
                <svg class="brand__mark" viewBox="0 0 48 48" aria-hidden="true">
                    <rect class="bm-bg" x="1.5" y="1.5" width="45" height="45" rx="12" />
                    <path class="bm-line" d="M11 24l9-9 7 7 7-7 5 5-12 12-7-7-5 5z" />
                    <path class="bm-spark" d="M24 28l5 5" />
                </svg>
                <span class="brand__name">ResQ<span>Hub</span></span>
            </a>
            <nav class="nav" aria-label="Main">
                <a href="index.html">Home</a>
                <a class="hub-only" href="dashboard.html">My organization</a>
                <a class="hub-only" href="offers.html" aria-current="page">Incoming offers <span class="count" data-pending-count hidden></span></a>
                <a href="disasters.html">Disasters</a>
            </nav>
            <div class="account">
                <span class="account__who"><strong data-account-name></strong><small data-account-role></small></span>
                <button class="btn btn--ghost btn--sm" type="button" data-logout>Log out</button>
            </div>
        </div>
    </header>

    <main class="wrap" id="main">
        <div class="flash" id="flash" aria-live="polite"></div>

        <section class="intro">
            <a class="back" href="dashboard.html"><span aria-hidden="true">←</span> Back to my organization</a>
            <h1 class="intro__title">Incoming offers</h1>
            <p class="intro__text">Confirm delivery only when the aid has actually been received.</p>
        </section>

        <form class="toolbar" id="filters" role="search" aria-label="Filter offers">
            <div class="field field--grow">
                <label class="field__label" for="search">Search</label>
                <input class="input" id="search" type="search" placeholder="Contributor name, email or need" autocomplete="off">
            </div>
            <div class="field">
                <label class="field__label" for="status">Status</label>
                <select class="input select" id="status">
                    <option value="All">All statuses</option>
                    <option value="pending">Pending</option>
                    <option value="received">Received</option>
                    <option value="declined">Declined</option>
                </select>
            </div>
            <div class="field">
                <label class="field__label" for="need">Need</label>
                <select class="input select" id="need">
                    <option value="All">All needs</option>
                </select>
            </div>
        </form>

        <p class="results-count" id="result-count" aria-live="polite"></p>

        <section class="panel" aria-labelledby="offers-title">
            <div class="panel__head">
                <h2 class="panel__title" id="offers-title" tabindex="-1">Offers</h2>
                <span class="count" id="pending-label" hidden></span>
            </div>
            <div class="offers" id="offers"></div>
        </section>

        <dialog class="dialog" id="confirm-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-text">
            <form class="dialog__body" method="dialog">
                <h2 class="dialog__title" id="dialog-title">Confirm receipt?</h2>
                <div class="dialog__offer">
                    <p class="offer__title" id="dialog-offer-title"></p>
                    <p class="offer__meta" id="dialog-offer-meta"></p>
                </div>
                <p class="dialog__text" id="dialog-text"></p>
                <div class="dialog__actions">
                    <button class="btn btn--ghost" type="submit" value="cancel" autofocus>Cancel</button>
                    <button class="btn btn--loud" type="button" id="dialog-ok">Yes, confirm receipt</button>
                </div>
            </form>
        </dialog>
    </main>

    <footer class="footer">
        <div class="footer__inner">
            <p class="footer__brand">
                <svg class="footer__mark" viewBox="0 0 48 48" aria-hidden="true">
                    <rect class="bm-bg" x="1.5" y="1.5" width="45" height="45" rx="12" />
                    <path class="bm-line" d="M11 24l9-9 7 7 7-7 5 5-12 12-7-7-5 5z" />
                    <path class="bm-spark" d="M24 28l5 5" />
                </svg>
                <span class="brand__name">ResQ<span>Hub</span></span>
            </p>
            <p class="footer__text">Connecting local organizations with people who can help.</p>
            <p class="footer__copy">&copy; 2026</p>
        </div>
    </footer>
</body>

</html>
